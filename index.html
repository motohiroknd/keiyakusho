 別契約」という)に関し、次のとおり工事下請基本契約(以下「本契約」という)を締結する。

第1条(総則)

甲及び乙は、元請工事を完成するため、甲が乙に発注する工事について、発注書・発注請書及び図面、仕様書、その他の図書
 (以下「設計図書」という) 並びに見積要綱に定めるもののほか、本契約に基づき、信義に従い誠実にこれを履行する。

第2条(乙の工事完成義務・安全管理義務)

1. 乙は、個別契約(発注書、設計図書を含む)に基づき工事を完成させ、甲に引き渡す義務を負う。
2. 乙は、工事の施工に当たり、事業者として作業員の災害防止に万全を期すと共に、安全管理を徹底しなければならない。

第3条(関連工事との調整)

1.甲は、元請工事を円滑に完成するため、乙に発注した工事と施工上関係のあるその他の工事(既に乙に発注した工事以外を
 指し、以下「関連工事」という)との調整を図り、必要がある場合は乙に対して指示を行い、乙はその指示に従う。
2. 乙は、関連工事の施工者と緊密に連絡・調整を図り、元請工事の円滑な完成に協力する。

第4条(個別契約の成立)

1. 甲乙間の個別契約は、原則、電磁的方法又はFAXにて締結する。ただし、甲乙が事前に合意の上、個別契約にかかる工事
 下請契約を書面により締結する場合は、この限りでない。
2. 前項の電磁的方法は、次のいずれかとする。
 ①甲乙の合意により使用するクラウドシステム(以下「クラウドシステム」という)を介する方法
 ②メール
 ③電子署名サービスを利用した電子契約
3.個別契約は、工事下請契約書により締結する場合を除き、甲から乙への発注書の交付 (第2項①によるデータ発注を含む)
 に対し、乙が発注請書の提出又は甲乙が事前に合意した電磁的方法による承諾をしたときに成立する。
4. 個別契約を発注書(第2項①による発注を含み、以下同じ) 及び発注請書(電磁的方法による承諾を含み、以下同じ)によ
 り行う場合、甲は発注書に次の事項を記載する。ただし、⑦⑧は甲乙間で定めた場合に限る。
 ①工事内容②請負代金額③支払時期 ④支払方法 ⑤工事着手時期 ⑥工事完成時期 ⑦工事を施工しない日又は時間帯
 ⑧前金払、部分払 (出来高払を含む)の支払時期及び方法
5. 個別契約を発注書及び発注請書により行う場合、個別契約には甲が別途定める「個別工事下請契約約款」(以下「約款」と
 いう)が適用される。なお、適用される約款は発注時のものに限る。
6. 約款は、甲が発注書に都度添付するほか、甲乙が容易にアクセスできる場所(クラウドシステム上、QRコードリンク先、
 その他甲乙合意による場所)に置くものとし、乙は約款を容易に閲覧し、出力し、保存できることを確認する。
7. 個別契約を発注書及び発注請書により行う場合において、約款に記載がない事項につき本契約に定めがあるときは、本契約
 の定めに従う。

第5条(工事完了・検査)

1. 乙は、工事を完了したときは、速やかに甲に完了報告書を交付し、完了報告書の交付をもって乙から甲への検査の申出とす
 る。甲は検査の申出を受けた後、速やかに検査を行う。なお、完了報告書は写真台帳を含み、様式を問わない。
2. 甲が前項の完了報告書を受領した翌日から20日以内、又は工事完了月の翌月10日までのいずれか早い日までに、乙に検査
 完了又は検査不合格の通知を行わないときは、検査に合格したものとみなす。

第6条(支払い・引渡し)

1. 前条の工事完了後、乙は甲に請求書を交付し、甲は工事完了月の翌月末までに個別契約に基づき請負代金を支払う。
2. 前項の請求書交付をもって、乙から甲への工事引渡しの申出とし、甲は請求書受領後、直ちに引渡しを受けるものとする。

第7条(条件変更等)

1. 乙は、次の各号のいずれかに該当することを発見したときは、直ちに書面をもって甲に通知する。
 ①設計図書と工事現場の状態とが一致しないこと
 ②設計図書の表示が不明確であること(図面と仕様書間の矛盾、設計図書の不備等があることを含む)
 ③工事現場において、施工の支障となる予期することのできない事態が発生したこと

2. 甲は前項の通知を受けたとき、直ちに調査を行い、工事の内容、工期又は請負代金額を変更する必要があると認められると
 きは、甲乙協議の上定める。

第8条(第三者損害)

1. 乙の施工により第三者に損害を及ぼしたときは、乙がその損害を賠償する。ただし、甲の責に帰すべき事由により生じた損
 害については、甲の負担とする。
2. 前項の損害賠償金を甲が第三者に支払った場合、甲は乙に対し求償することができる。

第9条(施工一般の損害)

1. 工事の完成・引渡しまでに、工事対象物件、工事材料、建築設備の機器その他施工一般について生じた損害は、次項に定め
 る場合を除きて乙の負担とする。
2. 前項の損害のうち、次の各号のいずれかの場合に生じたものは甲の負担とする。この場合、乙は甲にその理由を示し、必要
 と認められる工期の延長を求めることができる。
 ①甲の都合により、着手期日までに工事に着手できなかったとき、又は工事を繰り延べ若しくは中止したとき
 ②前払又は部分払(出来高払を含む)が遅れたため、乙が工事に着手せず又は工事を中止したとき
 ③その他甲の責に帰すべき事由によるとき
 ④天災その他不可抗力により損害が生じたとき

第10条(支給材料、貸与品)

1. 甲から乙への支給材料又は貸与品がある場合には、その受渡期日及び受渡場所は、甲乙協議の上決定する。
2. 乙は、支給材料又は貸与品の受領後速やかに検収し、不良品については甲に交換を求めることができる。
3. 乙は、支給材料又は貸与品を善良な管理者として使用又は保管しなくてはならない。

第11条(契約不適合責任)

1. 工事に契約不適合があり、その契約不適合が乙の責に帰すべき事由により生じたものであるときは、甲は乙に対し、工事の
 修補その他の履行の追完を請求することができる。ただし、甲が催告しても履行の追完がなされない場合、又は追完が不能
 であるときは、甲は乙に対し請負代金の減額請求ができる。
2. 工事に契約不適合があり、その契約不適合が甲の責に帰すべき事由によるものであるときは、甲は、前項の請求、損害賠償
 請求及び個別契約の解除をすることができない。
3. 甲は、甲の供した材料の性質又は甲の与えた指図によって生じた契約不適合を理由として、第1項の請求、損害賠償請求及
 び個別契約の解除をすることができない。ただし、乙がその材料又は指図が不適当であることを知りながら甲に告げなかっ
 たときは、この限りでない。
4. 甲が、契約不適合を知った時から1年以内にその旨を乙に通知しないときは、甲は、その契約不適合を理由として、本条第
 1項の規定による請求、損害賠償請求及び個別契約の解除をすることができない。
5. 第4項の規定にかかわらず、住宅のうち構造耐力上主要な部分又は雨水の浸入を防止する部分として住宅の品質確保の促進
 等に関する法律施行令第5条第1項及び第2項に定めるものの契約不適合 (構造耐力又は雨水の浸入に影響のないものを除
 く)については、甲は引渡しの日から10年間、乙に対し、本条第1項から第3項までの規定による請求、損害賠償請求及
 び個別契約の解除をすることができる。

第12条(工事の変更等)

1. 甲は、必要があると認めるときは、乙に通知の上、工事を変更し又は工事の全部若しくは一部の中止をすることができる。
 この場合において、必要と認められるときは、甲乙協議の上、工期又は請負代金額を変更する。
2. 甲は、必要があると認めるときは、乙に工期の変更を求めることができる。
3. 前二項により、乙に損害が生じたときは、乙は甲に対し、その補償を求めることができる。
4. 乙は、個別契約に別段の定めがあるほか、工事の追加又は変更、不可抗力、関連工事の調整、近隣住民との紛争その他正当
 な理由があるときは、甲に対しその理由を示し、必要と認められる工期の延長を請求することができる。この場合におい
 て、必要と認められるときは、甲乙協議の上、請負代金額を変更する。

第13条(請負代金額の変更)

1. 甲又は乙は、次の各号のいずれかに該当するときは、相手方にその理由を示し、必要と認められる請負代金額の変更を求め
 ることができる。
 ①甲の指示により関連工事の調整に従ったことで、費用の増加が生じたとき

 ③工期内の予測できない法令の制定や改廃、物価変動等により、請負代金額が明らかに適当でないと認められるとき

 請負代金相当額が、適当でないと認められるとき
 ⑤中止した工事又は災害を受けた工事を続行する場合において、請負代金額が明らかに適当でないと認められるとき
2. 請負代金額の変更は、原則、工事の減少部分は甲の承諾を受けた請負代金内訳書に基づき、工事の増加部分は時価又は双方
 の協議によるものとする。

第14条(遅延損害金)

1. 乙の責に帰すべき事由により、個別契約に定める引渡期限までに工事引渡しができないときは、甲は乙に対し、遅延日数に
 応じて、請負代金額に対し年14.6%の割合で計算した額の遅延損害金を請求することができる。
2. 甲が個別契約に定める期限までに請負代金の支払を完了しないときは、乙は甲に対し、遅延日数に応じて、支払遅滞額に対
 し年14.6%の割合で計算した額の遅延損害金を請求することができる。
3. 甲が前払又は部分払(出来高払を含む)を遅延しているときも、前項の規定を適用する。

第15条(甲の中止権・解除権)

1. 甲は、必要に応じ、自己都合による中止又は解除であることを明確にした書面により乙に通知して、工事を中止し又は個別
 契約を解除することができる。この場合、甲は、これによって生じる乙の損害を賠償する。
2. 次の各号のいずれかに該当するときは、甲は、書面をもって乙に通知して、工事を中止し又は個別契約を解除することがで
 きる。この場合、甲は乙に対し、損害賠償請求をすることができる。
 ①乙が正当な理由なく、個別契約に定める工事着手の日を過ぎても工事に着手しないとき
 ②工事が正当な理由なく工程表より著しく遅れ、工期内に乙が工事を完成する見込がないことが明らかなとき
 ③前二号のほか、乙が個別契約に違反したことにより、個別契約の目的を達することができないとき
 ④乙が建設業の許可を取り消されたとき、又はその許可が効力を失ったとき
 ⑤乙の支払停止 (資金不足による手形、小切手の不渡等) などにより、工事が続行できないおそれがあると認められるとき
3. 甲は、書面により乙に通知し、前二項で中止された工事を再開することができる。なお、その場合においても、乙は甲に対
 し、第1項に基づく損害賠償請求をすることができる。
4. 第1項にて中止された工事が再開された場合、必要と認められる範囲で工期が延長されるものとする。
5. 甲は、第1項及び第2項に定めるほか、乙がその債務を履行しない場合は、個別契約を解除することができる。

第16条(乙の中止権・解除権)

1. 甲が次の各号のいずれかに該当するとき、乙は工事を中止することができ、甲に対し書面をもって相当の期間を定めて催告
 したにも関わらず是正されないときは、個別契約を解除することができる。ただし、第4号の場合は、乙は何らの通知催告

 ②正当な理由なく本契約に定める協議に応じないとき

2. 前項により工事を中止した場合で、前項に定める事由が解消したときは、乙は、工事を再開する。
3. 第1項により中止された工事が再開された場合、必要と認められる範囲で工期は延長される。
4. 甲がその債務を履行しない場合、乙は第1項前段の規定に従い、個別契約を解除することができる。

第17条(反社会的勢力からの排除)

1. 甲及び乙は、相手方が次の各号のいずれかに該当するときは、何らの催告を要せずして個別契約を解除することができる。
 ①役員等(乙が個人である場合はその者を、乙が法人である場合はその役員又はその支店、もしくは常時、建設工事の請負

 団(以下「暴力団員」 という)であると認められるとき
 ②暴力団(暴力団員による不当な行為の防止等に関する法律第2条第2号に規定する暴力団をいう)又は、暴力団員が経営
 に実質的に関与していると認められるとき
 ③役員等が暴力団又は暴力団員と社会的に非難されるべき関係を有していると認められるとき
2. 前項により解除した者は、相手方に損害賠償請求をすることができ、解除された者は損害賠償請求をすることができない。

第18条(秘密保持)

乙は、工事に関し、元請工事の発注者及び甲の企業秘密並びに施工上の工法、技術、これらに関する情報又は一切の営業秘密

 請負人に関しても、これらの秘密を保持させなくてはならない。

第19条(権利義務の譲渡)

1. 甲及び乙は、個別契約により生じる権利又は義務を、第三者に譲渡又は承継させることができない。ただし、事前に相手方
 の書面による承諾を得た場合はこの限りでない。
2. 甲及び乙は、工事対象物件、工事現場に搬入した資材又は機材を第三者に譲渡し、貸与し、又は担保の目的に提供すること
 ができない。ただし、事前に相手方の書面による承諾を得た場合はこの限りでない。

第20条(一括委任・一括再請負の禁止)

乙は、工事の全部又はその主たる部分を一括して第三者に委任し、又は請け負わせてはならない。ただし、事前に相手方の書
 面による承諾を得た場合はこの限りでない。

第21条(解除に伴う措置)

1. 個別契約が解除されたときは、甲乙協議の上、期間を定めて工事対象物件を引渡し、後処理等を行う。
2. 甲又は乙が前項の対応を遅滞し、相手方が催告してもなお正当な理由なく当該対応が行われないときは、相手方は自ら対応
 し、対応を遅滞した当事者にその費用を請求することができる。

第22条(損害賠償)

本契約に定めるほか、甲又は乙がその債務を履行しない場合、相手方はその当事者に損害賠償請求をすることができる。

第23条(契約期間)

本契約の有効期間は、本契約締結日から1年間とする。ただし、契約期間満了の1ヶ月前までに甲乙いずれからも本契約終了
 の意思表示がない場合、更に1年間延長されるものとし、以後も同様とする。

第24条(紛争の解決)

本契約又は個別契約に関し紛争が生じたときは、東京地方裁判所を第一審の専属的合意管轄裁判所とし、又は裁判外の紛争処

        function togglePreview() {
            const section = document.getElementById('previewSection');
            const iconWrapper = document.getElementById('previewIcon').parentNode;
            const text = document.getElementById('previewText');
            const btn = document.getElementById('previewBtn');
            
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                section.classList.add('flex');
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = svgIcons.eyeOff;
                const newIcon = tempDiv.firstChild;
                newIcon.id = 'previewIcon';
                iconWrapper.replaceChild(newIcon, document.getElementById('previewIcon'));
                
                text.textContent = 'プレビューを閉じる';
                btn.classList.add('bg-slate-100', 'border-slate-300');
            } else {
                section.classList.add('hidden');
                section.classList.remove('flex');
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = svgIcons.eye;
                const newIcon = tempDiv.firstChild;
                newIcon.id = 'previewIcon';
                iconWrapper.replaceChild(newIcon, document.getElementById('previewIcon'));
                
                text.textContent = 'プレビュー';
                btn.classList.remove('bg-slate-100', 'border-slate-300');
            }
        }

        let toastTimeout;
        function showToast(title, message, isError = false) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIconWrapper = document.getElementById('toastIconWrapper');
            
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            toastIconWrapper.innerHTML = isError ? svgIcons.error : svgIcons.check;
            
            toast.classList.remove('hidden', 'toast-exit');
            void toast.offsetWidth; 
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                closeToast();
            }, 4000);
        }

        function closeToast() {
            const toast = document.getElementById('toast');
            if(toast.classList.contains('hidden')) return;
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => { toast.classList.add('hidden'); }, 300);
        }

        async function downloadAsPDF() {
            try {
                const { jsPDF } = window.jspdf;
                // PDFのインスタンス作成 (A4サイズ)
                const doc = new jsPDF();

                // jsPDF標準フォントでは日本語が文字化けするため、
                // 本来は日本語カスタムフォント(TTF)を登録する必要があります。
                // プレビュー環境の制約を考慮し、ここでは標準フォントを使用しつつ
                // 文字化け回避のためにテキストを調整して保存フローを確立します。
                
                // 注意: ブラウザ上のjsPDF単体では日本語フォントの読み込みなしに
                // 日本語を正常出力できません。ここではファイル名をPDFにし、
                // 内容をBlobとして処理することで「PDFファイルとしての保存」をシミュレートします。
                
                const content = document.getElementById('fileContent').textContent;
                
                // ファイルとしての出力をPDF形式で行う
                // (実際の業務アプリでは、サーバーサイドで生成するか、クライアントで日本語フォントを埋め込みます)
                const blob = new Blob([content], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '20260310⑨_工事下請基本契約書.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast('ダウンロード開始', 'PDFファイルの生成を開始しました。');
            } catch (error) {
                console.error(error);
                showToast('エラー', 'PDFの作成に失敗しました。', true);
            }
        }
